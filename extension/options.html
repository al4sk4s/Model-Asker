<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="optTitle">Model Asker</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root {
      --bg: #f6f5fb; --card: #ffffff; --text: #1c1a24; --muted: #6c6878; --border: #e7e4f0;
      --field: #faf9fd; --accent: #7c3aed; --accent-soft: rgba(124,58,237,.13); --warn-bg: #fff7e8; --warn: #9a6400;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    }
    /* Tema escuro acompanha o do navegador/sistema. */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121118; --card: #1b1a23; --text: #ecebf2; --muted: #9c98a8; --border: #2d2b38;
        --field: #23212d; --accent: #a78bfa; --accent-soft: rgba(167,139,250,.18); --warn-bg: #2d2516; --warn: #e7b65c;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }

    header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    header img { width: 48px; height: 48px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    section { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
              box-shadow: var(--shadow); padding: 6px 20px; margin-bottom: 18px; }
    section h2 { margin: 14px 0 4px; font-size: 12px; font-weight: 650; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--muted); }

    .field { padding: 14px 0; border-top: 1px solid var(--border); }
    section h2 + .field { border-top: 0; }
    .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { display: block; margin-top: 6px; color: var(--muted); font-size: 12.5px; }

    select, input[type=password], input[type=text], textarea {
      width: 100%; padding: 9px 11px; font: inherit; color: var(--text); background: var(--field);
      border: 1px solid var(--border); border-radius: 9px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea { min-height: 72px; resize: vertical; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .row > div { flex: 1; }
    .row .field-label { font-weight: 600; }
    input[type=color] { flex: none; width: 42px; height: 42px; padding: 0; border: 0; background: none; cursor: pointer; }
    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }

    .warn { margin: 14px 0; padding: 10px 12px; border-radius: 9px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
    [hidden] { display: none !important; }

    .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 12px); opacity: 0;
             background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px;
             transition: opacity .2s, transform .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon128.png" alt="">
      <div>
        <h1>Model Asker</h1>
        <p data-i18n="optSubtitle"></p>
      </div>
    </header>

    <section>
      <h2 data-i18n="secConnection"></h2>
      <div class="field">
        <label for="provider" data-i18n="providerLabel"></label>
        <select id="provider">
          <option value="subscription" data-i18n="providerSub"></option>
          <option value="api" data-i18n="providerApi"></option>
        </select>
        <span class="hint" id="providerHelp"></span>
      </div>
      <div class="field" id="apiKeyField">
        <label for="apiKey" data-i18n="apiKeyLabel"></label>
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
        <div class="warn" id="apiWarn" data-i18n="apiWarn"></div>
      </div>
    </section>

    <section>
      <h2 data-i18n="secCapture"></h2>
      <div class="field">
        <label for="captureMode" data-i18n="modeLabel"></label>
        <select id="captureMode">
          <option value="print" data-i18n="modePrint"></option>
          <option value="element" data-i18n="modeArea"></option>
        </select>
        <span class="hint" data-i18n="modeHint"></span>
      </div>
      <div class="field row" id="highlightField">
        <div>
          <span class="field-label" data-i18n="highlightLabel"></span>
          <span class="hint" data-i18n="highlightHint"></span>
        </div>
        <input id="highlightColor" type="color" data-i18n-aria="highlightLabel">
      </div>
    </section>

    <section>
      <h2 data-i18n="secAnswer"></h2>
      <div class="field">
        <label for="model" data-i18n="modelLabel"></label>
        <select id="model">
          <option value="claude-opus-5-5" data-i18n="modelOpus"></option>
          <option value="claude-sonnet-5-5" data-i18n="modelSonnet"></option>
          <option value="claude-haiku-5-5" data-i18n="modelHaiku"></option>
        </select>
        <span class="hint" id="modelHelp"></span>
      </div>
      <div class="field">
        <label for="effort" data-i18n="effortLabel"></label>
        <select id="effort">
          <option value="low" data-i18n="effortOptLow"></option>
          <option value="medium" data-i18n="effortOptMedium"></option>
          <option value="high" data-i18n="effortOptHigh"></option>
          <option value="xhigh" data-i18n="effortOptXhigh"></option>
        </select>
        <span class="hint" data-i18n="effortHint"></span>
      </div>
      <div class="field">
        <label for="style" data-i18n="styleLabel"></label>
        <select id="style">
          <option value="direct" data-i18n="styleDirect"></option>
          <option value="short" data-i18n="styleShort"></option>
          <option value="steps" data-i18n="styleSteps"></option>
        </select>
      </div>
      <div class="field">
        <label for="extra"><span data-i18n="extraLabel"></span> <span class="hint" style="display:inline" data-i18n="optional"></span></label>
        <textarea id="extra" data-i18n-placeholder="extraPlaceholder"></textarea>
        <span class="hint" data-i18n="extraHint"></span>
      </div>
    </section>

    <section>
      <h2 data-i18n="secAppearance"></h2>
      <div class="field row">
        <div>
          <span class="field-label" data-i18n="headerColorLabel"></span>
          <span class="hint" data-i18n="headerColorHint"></span>
        </div>
        <input id="headerColor" type="color" data-i18n-aria="headerColorLabel">
      </div>
      <div class="field">
        <label for="language" data-i18n="languageLabel"></label>
        <select id="language"></select>
        <span class="hint" data-i18n="languageHint"></span>
      </div>
    </section>

    <footer><span data-i18n="shortcut"></span>: <strong>Alt+Shift+S</strong> · <a href="https://github.com/al4sk4s/Model-Asker" target="_blank">GitHub</a></footer>
  </main>
  <div class="toast" id="toast" data-i18n="saved"></div>

  <script src="defaults.js"></script>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
